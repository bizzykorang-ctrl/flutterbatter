<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FAQ — Flutter Batter</title>
  <meta name="description" content="Answers about Flutter Batter ordering, delivery, payment and gifting.">
  <link rel="manifest" href="manifest.json?v=3">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="stylesheet" href="css/site.css?v=4">
</head>
<body>
  <header class="site-header" id="siteHeader"></header>

  <main class="wrap" style="padding-bottom:80px;max-width:840px">
    <section class="page-hero"><span class="eyebrow">Good to know</span><h1>Frequently asked questions</h1></section>
    <div id="faqFull" class="reveal"></div>
    <div class="cta-band reveal" style="margin-top:40px;padding:36px">
      <h2 style="font-size:1.5rem">Didn't find your answer?</h2>
      <p>WhatsApp is fastest — we reply during kitchen hours.</p>
      <a class="btn btn-ink" href="https://wa.me/233201234567" target="_blank" rel="noopener">WhatsApp us</a>
    </div>
  </main>

  <footer class="site-footer" id="siteFooter"></footer>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="js/config.js?v=3"></script>
  <script src="js/data.js?v=3"></script>
  <script src="js/motion.js?v=2"></script>
  <script src="js/home.js?v=3"></script>
  <script src="js/page.js?v=3"></script>
  <script>
    window.FB_page.on(async () => {
      const s = await window.FB.settings();
      const list = document.getElementById("faqFull");
      list.innerHTML = (s.faq || []).map((f) => `
        <div class="faq-item">
          <button class="faq-q">${window.FB.esc(f.q)} <span class="tw">+</span></button>
          <div class="faq-a"><p>${window.FB.esc(f.a)}</p></div>
        </div>`).join("");
      list.querySelectorAll(".faq-item").forEach((item) => {
        item.querySelector(".faq-q").addEventListener("click", () => {
          const open = item.classList.contains("open");
          list.querySelectorAll(".faq-item").forEach((x) => x.classList.remove("open"));
          if (!open) item.classList.add("open");
        });
      });
    });
  </script>
  <script src="js/app.js?v=3"></script>
</body>
</html>
