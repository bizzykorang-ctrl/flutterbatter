<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My account — Flutter Batter</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="stylesheet" href="css/site.css?v=4">
</head>
<body>
  <header class="site-header" id="siteHeader"></header>

  <main class="wrap" style="padding:36px 0 90px">
    <div class="page-hero" style="padding-top:0"><span class="eyebrow">Your corner</span><h1>My account</h1></div>

    <!-- auth card (shown signed-out) -->
    <div class="card auth-card" id="authCard">
      <div class="tabs">
        <button class="on" id="tabIn">Sign in</button>
        <button id="tabUp">Create account</button>
      </div>
      <form id="authForm">
        <div class="field" id="fName" style="display:none"><label for="acName">Full name</label><input id="acName" maxlength="80"></div>
        <div class="field"><label for="acEmail">Email</label><input id="acEmail" type="email" required></div>
        <div class="field"><label for="acPass">Password</label><input id="acPass" type="password" required minlength="6"></div>
        <button class="btn btn-primary" style="width:100%" id="authBtn" type="submit">Sign in</button>
        <p class="sub" id="authMsg" style="font-size:.85rem;margin-top:12px;text-align:center"></p>
      </form>
    </div>

    <!-- account dashboard (shown signed-in) -->
    <div id="acctDash" style="display:none">
      <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;margin-bottom:24px">
        <p class="sub" id="acctHello"></p>
        <button class="btn btn-ghost btn-sm" id="signOutBtn">Sign out</button>
      </div>

      <section style="margin-bottom:44px">
        <div class="section-head" style="margin-bottom:18px"><span class="eyebrow">Reorder in a tap</span><h2>Order history</h2></div>
        <div id="ordersList"></div>
      </section>

      <section>
        <div class="section-head" style="margin-bottom:18px"><span class="eyebrow">Faster checkout</span><h2>Saved addresses</h2></div>
        <div class="grid grid-2" id="addrList"></div>
        <div class="card" style="max-width:560px;margin-top:16px;padding:22px">
          <h3 style="margin-bottom:12px" id="addrFormTitle">Add an address</h3>
          <form id="addrForm">
            <input type="hidden" id="adId">
            <div class="form-grid two">
              <div class="field"><label for="adLabel">Label</label><input id="adLabel" value="Home" maxlength="24"></div>
              <div class="field"><label for="adArea">Area / zone</label>
                <select id="adArea"></select></div>
            </div>
            <div class="field"><label for="adStreet">Street / landmark</label><input id="adStreet" required maxlength="140"></div>
            <div class="field"><label style="display:flex;gap:8px;align-items:center;font-weight:600;color:var(--ink-soft)">
              <input type="checkbox" id="adDefault" style="width:auto"> Make this my default address</label></div>
            <div style="display:flex;gap:10px">
              <button class="btn btn-primary btn-sm" type="submit">Save address</button>
              <button class="btn btn-ghost btn-sm" type="button" id="addrCancel" style="display:none">Cancel</button>
            </div>
          </form>
        </div>
      </section>
    </div>
  </main>

  <footer class="site-footer" id="siteFooter"></footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="js/config.js?v=3"></script>
  <script src="js/data.js?v=3"></script>
  <script src="js/motion.js?v=2"></script>
  <script src="js/home.js?v=3"></script>
  <script src="js/page.js?v=3"></script>
  <script src="js/account.js?v=3"></script>
  <script src="js/app.js?v=3"></script>
</body>
</html>
